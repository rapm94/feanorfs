[workspace]
# Point cargo-dist at the Cargo workspace once. Package selection belongs in
# `[dist].packages`; listing member paths separately rediscovers the workspace.
# Repository-owned reusable workflows build the platform products inside the
# generated cargo-dist graph. The release is announced only after their exact
# combined asset manifest passes.
members = ["cargo:."]

# Config for 'dist'
[dist]
# `feanorfs` includes both sync and `feanorfs serve`; the legacy server-only
# binary remains source-buildable but is not a separate release product.
# Cross-platform desktop products are released by the repository-owned
# macOS and Linux/Windows workflows.
packages = ["feanorfs-client"]
# Keep cargo package naming internal while presenting the product consistently.
display-name = "FeanorFS"
# GitHub already exposes source archives for every tag.
source-tarball = false
# Avoid `cargo build --workspace`, which would compile the tray on Linux.
precise-builds = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Build every release product with the same exact compiler as the relay image.
# This is the product toolchain, distinct from the supported Rust 1.88 MSRV.
rust-toolchain-version = "1.88.0"
# CI backends to support
ci = "github"
# Build desktop products as first-class dependencies of cargo-dist, validate
# the complete staged asset set, and create the public release exactly once.
local-artifacts-jobs = ["./tray-release", "./desktop-release"]
publish-jobs = ["./validate-release-assets"]
github-custom-job-permissions = { tray-release = { actions = "read", attestations = "write", contents = "read", id-token = "write" }, desktop-release = { actions = "read", attestations = "write", contents = "read", id-token = "write" }, validate-release-assets = { actions = "read", contents = "read" } }
# Platform desktop installers are the only public installer entrypoints. Keep
# cargo-dist focused on attested CLI archives so its generated scripts cannot
# be mistaken for the tray-inclusive product.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Defer the sole public-release mutation until every custom build and exact
# asset-manifest validation job has succeeded.
github-release = "announce"
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# When to generate GitHub Attestations
github-attestations-phase = "announce"
# Attest every published CLI archive plus its checksum and canonical manifest.
# cargo-dist installers are disabled, so script filters would match no product.
github-attestations-filters = ["*.tar.xz", "*.zip", "*.sha256", "sha256.sum", "dist-manifest.json"]

# release.yml is generator-owned, so immutable action references live here.
# Keep the version comments in sync manually when Dependabot proposes updates;
# cargo-dist currently emits only the configured commit in generated YAML.
[dist.github-action-commits]
"actions/checkout" = "df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
"actions/attest" = "a1948c3f048ba23858d222213b7c278aabede763" # v4.1.1
"swatinem/rust-cache" = "c19371144df3bb44fab255c43d04cbc2ab54d1c4" # v2.9.1
"actions/setup-node" = "48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0

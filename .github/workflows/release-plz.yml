name: Release-plz

# release-plz automates semantic versioning, changelog generation, and git tags
# from Conventional Commits. GitHub Releases and binary artifacts are handled
# by cargo-dist (.github/workflows/release.yml) when the tag is pushed.
# This workflow runs only after CI succeeds on a trusted main-branch push, so a
# failing commit cannot publish a release. workflow_dispatch is the recovery path.
#
# Prerequisite — secret RELEASE_PLZ_TOKEN (PAT with contents:write +
# pull-requests:write), either:
#   • Repository secret: Settings → Secrets and variables → Actions
#   • Environment secret: Settings → Environments → prod → Environment secrets
#     (requires `environment: prod` on each job below)
# The default GITHUB_TOKEN cannot trigger downstream workflows on tag push.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    branches:
      - main
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-main
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release
    if: >-
      github.repository == 'rapm94/feanorfs' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Verify release token
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
        run: |
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::Missing secret RELEASE_PLZ_TOKEN."
            echo "Add it as a repository secret (Settings → Secrets → Actions)"
            echo "or as an environment secret on the 'prod' environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Verify exact trusted CI and Security commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "rapm94/feanorfs" ]; then
            echo "::error::Release automation runs only in rapm94/feanorfs."
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::main is $actual_sha, but this run expected $EXPECTED_SHA."
            exit 1
          fi

          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$TRIGGER_EVENT" != push ] || [ "$TRIGGER_BRANCH" != main ] || \
              [ "$TRIGGER_REPOSITORY" != "$REPOSITORY" ]; then
              echo "::error::Automatic release requires a trusted main-push CI run."
              exit 1
            fi
          elif [ "$EVENT_NAME" != workflow_dispatch ] || [ "$REF" != refs/heads/main ]; then
            echo "::error::Manual release recovery must be dispatched from main."
            exit 1
          fi

          trusted_run_id() {
            local workflow_file="$1"
            local workflow_name="$2"
            local runs
            runs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$workflow_file/runs" \
              -f branch=main \
              -f head_sha="$EXPECTED_SHA" \
              -f event=push \
              -f status=completed \
              -f per_page=100)"
            jq -r \
              --arg repository "$REPOSITORY" \
              --arg sha "$EXPECTED_SHA" \
              --arg workflow "$workflow_name" \
              '[.workflow_runs[] | select(
                .name == $workflow and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repository and
                .repository.full_name == $repository
              )] | first | .id // empty' <<<"$runs"
          }

          ci_run_id="$(trusted_run_id ci.yml CI)"
          if [ -z "$ci_run_id" ]; then
            echo "::error::No successful trusted main-push CI run exists for $EXPECTED_SHA."
            exit 1
          fi

          security_run_id=''
          for attempt in $(seq 1 100); do
            candidate="$(trusted_run_id security.yml Security)"
            if [ -n "$candidate" ]; then
              jobs="$(gh api --method GET \
                "repos/$REPOSITORY/actions/runs/$candidate/jobs?filter=latest&per_page=100")"
              if jq -e --arg sha "$EXPECTED_SHA" \
                'any(.jobs[];
                  .name == "Security success" and
                  .conclusion == "success" and
                  .head_sha == $sha)' <<<"$jobs" >/dev/null; then
                security_run_id="$candidate"
                break
              fi
            fi
            echo "Waiting for exact-SHA Security success ($attempt/100)..."
            sleep 15
          done
          if [ -z "$security_run_id" ]; then
            echo "::error::No successful trusted Security aggregator exists for $EXPECTED_SHA."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Detect versioned release candidate
        id: candidate
        run: |
          current="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1 | sed 's/^v//')"
          if [ -n "$current" ] && [ "$current" != "$latest" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run complete product release
        if: ${{ steps.candidate.outputs.ready == 'true' }}
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: scripts/check-release-readiness.sh

      - name: Run release-plz (release)
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          forge: github
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release PR
    needs: release-plz-release
    if: ${{ needs.release-plz-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Verify release token
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
        run: |
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::Missing secret RELEASE_PLZ_TOKEN."
            echo "Add it as a repository secret (Settings → Secrets → Actions)"
            echo "or as an environment secret on the 'prod' environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Verify exact trusted CI and Security commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "rapm94/feanorfs" ]; then
            echo "::error::Release automation runs only in rapm94/feanorfs."
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::main is $actual_sha, but this run expected $EXPECTED_SHA."
            exit 1
          fi

          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$TRIGGER_EVENT" != push ] || [ "$TRIGGER_BRANCH" != main ] || \
              [ "$TRIGGER_REPOSITORY" != "$REPOSITORY" ]; then
              echo "::error::Automatic release requires a trusted main-push CI run."
              exit 1
            fi
          elif [ "$EVENT_NAME" != workflow_dispatch ] || [ "$REF" != refs/heads/main ]; then
            echo "::error::Manual release recovery must be dispatched from main."
            exit 1
          fi

          trusted_run_id() {
            local workflow_file="$1"
            local workflow_name="$2"
            local runs
            runs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$workflow_file/runs" \
              -f branch=main \
              -f head_sha="$EXPECTED_SHA" \
              -f event=push \
              -f status=completed \
              -f per_page=100)"
            jq -r \
              --arg repository "$REPOSITORY" \
              --arg sha "$EXPECTED_SHA" \
              --arg workflow "$workflow_name" \
              '[.workflow_runs[] | select(
                .name == $workflow and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repository and
                .repository.full_name == $repository
              )] | first | .id // empty' <<<"$runs"
          }

          ci_run_id="$(trusted_run_id ci.yml CI)"
          if [ -z "$ci_run_id" ]; then
            echo "::error::No successful trusted main-push CI run exists for $EXPECTED_SHA."
            exit 1
          fi

          security_run_id=''
          for attempt in $(seq 1 100); do
            candidate="$(trusted_run_id security.yml Security)"
            if [ -n "$candidate" ]; then
              jobs="$(gh api --method GET \
                "repos/$REPOSITORY/actions/runs/$candidate/jobs?filter=latest&per_page=100")"
              if jq -e --arg sha "$EXPECTED_SHA" \
                'any(.jobs[];
                  .name == "Security success" and
                  .conclusion == "success" and
                  .head_sha == $sha)' <<<"$jobs" >/dev/null; then
                security_run_id="$candidate"
                break
              fi
            fi
            echo "Waiting for exact-SHA Security success ($attempt/100)..."
            sleep 15
          done
          if [ -z "$security_run_id" ]; then
            echo "::error::No successful trusted Security aggregator exists for $EXPECTED_SHA."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Configure cargo for git-only release history
        env:
          CARGO_WRAPPER: ${{ runner.temp }}/release-plz-cargo
        run: |
          cat > "$CARGO_WRAPPER" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          real_cargo="$(rustup which cargo)"
          historical_workspace=false
          for arg in "$@"; do
            if [ "$arg" = "--workspace" ]; then
              historical_workspace=true
              break
            fi
          done
          if [ "${1:-}" = "package" ] && [ "$historical_workspace" = true ]; then
            "$real_cargo" "$@" --no-verify
            target_dir="$("$real_cargo" metadata --format-version 1 --no-deps | jq -r '.target_directory')"
            for archive in "$target_dir"/package/*.crate; do
              tar -xzf "$archive" -C "$target_dir/package"
            done
            exit 0
          fi
          exec "$real_cargo" "$@"
          EOF
          chmod +x "$CARGO_WRAPPER"

      - name: Carry external product changes into the release package
        run: |
          scripts/update-release-product-state.sh --write
          if git diff --quiet -- common/release-product-state.txt; then
            exit 0
          fi
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          kind=fix
          if git log "${latest:-HEAD^}"..HEAD --format='%s' -- \
              client server agent-core tray scripts .github 'Dockerfile.relay*' | \
              grep -Eq '^feat([(:!]|$)'; then
            kind=feat
          fi
          git config user.name "release-plz[bot]"
          git config user.email "release-plz[bot]@users.noreply.github.com"
          git add common/release-product-state.txt
          git commit -m "$kind(release): carry product changes"

      - name: Run release-plz (release-pr)
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          forge: github
        env:
          CARGO: ${{ runner.temp }}/release-plz-cargo
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Sync npm versions into release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r 'try .number // empty' <<<"$RELEASE_PR")"
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          gh auth setup-git
          gh pr checkout "$pr_number"
          npm --prefix bindings/ts run assemble-metadata
          npm --prefix bindings/ts run verify-metadata
          git diff --check
          if git diff --quiet -- bindings/ts/package.json bindings/ts/package-lock.json bindings/ts/index.js bindings/ts/npm; then
            exit 0
          fi
          git config user.name "release-plz[bot]"
          git config user.email "release-plz[bot]@users.noreply.github.com"
          git add bindings/ts/package.json bindings/ts/package-lock.json bindings/ts/index.js bindings/ts/npm/*/package.json
          git commit -m "chore(release): sync npm package versions"
          git push

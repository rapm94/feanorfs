name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:${{ matrix.language }}

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # release.yml is generated and validated by cargo-dist. Audit only files
      # owned by this repository so regenerated code never needs local patches.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
          annotations: true
          inputs: |
            .github/dependabot.yml
            .github/workflows/ci.yml
            .github/workflows/desktop-release.yml
            .github/workflows/npm-release.yml
            .github/workflows/relay-image.yml
            .github/workflows/release-plz.yml
            .github/workflows/security.yml
            .github/workflows/tray-release.yml
            .github/workflows/unsigned-desktop-release.yml
            .github/workflows/validate-release-assets.yml
          min-severity: medium
          persona: pedantic
          version: "1.26.1"

  scheduled-dependencies:
    name: Scheduled dependency audit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
          arguments: --all-features

  fuzz:
    name: Fuzz parsers (${{ matrix.target }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [tree_codec, invites, signals, aead]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      # Same properties as common/tests/parser_fuzz.rs (stable, every test
      # run): never panic, and every accepted input re-encodes exactly.
      - name: Fuzz for two minutes
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time=120
      - name: Upload crashing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  security-success:
    name: Security success
    if: ${{ always() }}
    needs:
      - codeql
      - workflow-security
      - fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require workflow security
        if: ${{ needs.workflow-security.result != 'success' }}
        run: exit 1
      - name: Require parser fuzzing outside pull requests
        if: >-
          github.event_name != 'pull_request' &&
          needs.fuzz.result != 'success'
        run: exit 1
      - name: Require CodeQL outside pull requests
        if: >-
          github.event_name != 'pull_request' &&
          needs.codeql.result != 'success'
        run: exit 1
      - name: Confirm security success
        run: echo "All required security jobs for this event passed."

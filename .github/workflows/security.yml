name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # release.yml is generated and validated by cargo-dist. Audit only files
      # owned by this repository so regenerated code never needs local patches.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          inputs: |
            .github/dependabot.yml
            .github/workflows/ci.yml
            .github/workflows/desktop-release.yml
            .github/workflows/npm-release.yml
            .github/workflows/relay-image.yml
            .github/workflows/release-plz.yml
            .github/workflows/security.yml
            .github/workflows/tray-release.yml
            .github/workflows/unsigned-desktop-release.yml
            .github/workflows/validate-release-assets.yml
          min-severity: medium
          persona: pedantic
          version: "1.26.1"

  scheduled-dependencies:
    name: Scheduled dependency audit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  security-success:
    name: Security success
    if: ${{ always() }}
    needs:
      - codeql
      - workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require workflow security
        if: ${{ needs.workflow-security.result != 'success' }}
        run: exit 1
      - name: Require CodeQL outside pull requests
        if: >-
          github.event_name != 'pull_request' &&
          needs.codeql.result != 'success'
        run: exit 1
      - name: Confirm security success
        run: echo "All required security jobs for this event passed."

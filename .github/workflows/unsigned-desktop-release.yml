# Explicit founder-approved fallback for preview releases when platform signing
# credentials are unavailable. These artifacts are checksummed, attested, and
# conspicuously named "unsigned"; the trusted release workflows remain the
# default path and continue to fail closed without signing credentials.
name: Unsigned desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable application release tag
        required: true
        type: string
      confirm_unsigned:
        description: Publish clearly labeled untrusted macOS and Windows installers
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: unsigned-desktop-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: ${{ inputs.confirm_unsigned && github.repository == 'rapm94/feanorfs' }}
    name: Validate immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_id: ${{ steps.source.outputs.release_id }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require matching prerelease tag and release
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVOCATION_REF: ${{ github.ref }}
          INVOCATION_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "rapm94/feanorfs" ] || [ "$EVENT_NAME" != workflow_dispatch ]; then
            echo "::error::Unsigned preview publication requires a manual rapm94/feanorfs dispatch."
            exit 1
          fi
          if [ "$INVOCATION_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Dispatch ref $INVOCATION_REF is not refs/tags/$RELEASE_TAG."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid canonical stable release tag $RELEASE_TAG"
            exit 1
          fi
          release_json="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Release API returned an invalid release ID."
            exit 1
          fi
          if ! jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .prerelease == true' <<<"$release_json" >/dev/null; then
            echo "::error::Unsigned preview artifacts require the exact requested prerelease tag."
            exit 1
          fi
          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          if [ "$tag_type" = tag ]; then
            annotated="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<<"$annotated")"
            tag_type="$(jq -r '.object.type' <<<"$annotated")"
          fi
          if [ "$tag_type" != commit ]; then
            echo "::error::Release tag does not resolve directly to a commit."
            exit 1
          fi
          if [ "$INVOCATION_SHA" != "$tag_sha" ]; then
            echo "::error::Dispatch SHA $INVOCATION_SHA does not match $RELEASE_TAG at $tag_sha."
            exit 1
          fi
          release_target="$(jq -r '.target_commitish' <<<"$release_json")"
          release_sha="$(gh api "repos/$REPOSITORY/commits/$release_target" --jq '.sha')"
          if [ "$tag_sha" != "$release_sha" ]; then
            echo "::error::Release targets $release_sha, but $RELEASE_TAG resolves to $tag_sha."
            exit 1
          fi
          release_runs="$(gh api --method GET "repos/$REPOSITORY/actions/workflows/release.yml/runs" \
            -f head_sha="$tag_sha" -f event=push -f per_page=100)"
          if ! jq -e --arg repository "$REPOSITORY" --arg tag "$RELEASE_TAG" --arg sha "$tag_sha" \
            'any(.workflow_runs[];
              .conclusion == "success" and
              .event == "push" and
              .head_branch == $tag and
              .head_sha == $sha and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository)' \
            <<<"$release_runs" >/dev/null; then
            echo "::error::No successful cargo-dist release run exists for $RELEASE_TAG at $tag_sha."
            exit 1
          fi
          {
            echo "release_id=$release_id"
            echo "sha=$tag_sha"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout verified preview commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}

      - name: Require trusted main CI, Security, and matching version
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout is $actual_sha, expected $EXPECTED_SHA."
            exit 1
          fi
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ] || [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match workspace version v$version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::Unsigned preview commit is not reachable from origin/main."
            exit 1
          fi

          trusted_run_id() {
            local workflow_file="$1"
            local workflow_name="$2"
            local runs
            runs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$workflow_file/runs" \
              -f branch=main \
              -f head_sha="$EXPECTED_SHA" \
              -f event=push \
              -f per_page=100)"
            jq -r \
              --arg repository "$REPOSITORY" \
              --arg sha "$EXPECTED_SHA" \
              --arg workflow "$workflow_name" \
              '[.workflow_runs[] | select(
                .name == $workflow and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repository and
                .repository.full_name == $repository
              )] | first | .id // empty' <<<"$runs"
          }

          ci_run_id="$(trusted_run_id ci.yml CI)"
          if [ -z "$ci_run_id" ]; then
            echo "::error::No successful trusted main-push CI run exists for $EXPECTED_SHA."
            exit 1
          fi
          security_run_id="$(trusted_run_id security.yml Security)"
          if [ -z "$security_run_id" ]; then
            echo "::error::No successful trusted Security run exists for $EXPECTED_SHA."
            exit 1
          fi
          security_jobs="$(gh api --method GET \
            "repos/$REPOSITORY/actions/runs/$security_run_id/jobs?filter=latest&per_page=100")"
          if ! jq -e --arg sha "$EXPECTED_SHA" \
            'any(.jobs[];
              .name == "Security success" and
              .conclusion == "success" and
              .head_sha == $sha)' <<<"$security_jobs" >/dev/null; then
            echo "::error::Security success did not pass for $EXPECTED_SHA."
            exit 1
          fi


  build-macos:
    needs: validate-release
    name: Build unsigned macOS ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout verified preview commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build CLI and tray
        run: >-
          cargo build --release -p feanorfs-client -p feanorfs-tray
          --target ${{ matrix.target }} --locked
      - name: Verify native architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            aarch64-apple-darwin) expected=arm64 ;;
            x86_64-apple-darwin) expected=x86_64 ;;
            *) exit 1 ;;
          esac
          lipo "target/$TARGET/release/feanorfs" -verify_arch "$expected"
          lipo "target/$TARGET/release/feanorfs-tray" -verify_arch "$expected"
      - name: Upload native binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-macos-${{ matrix.target }}-${{ needs.validate-release.outputs.sha }}
          path: |
            target/${{ matrix.target }}/release/feanorfs
            target/${{ matrix.target }}/release/feanorfs-tray
          if-no-files-found: error
          retention-days: 1

  publish-macos:
    needs:
      - validate-release
      - build-macos
    name: Publish attested unsigned universal macOS installers
    environment: prod
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout verified preview commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Download arm64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-macos-aarch64-apple-darwin-${{ needs.validate-release.outputs.sha }}
          path: native/arm64
      - name: Download x86_64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-macos-x86_64-apple-darwin-${{ needs.validate-release.outputs.sha }}
          path: native/x86_64
      - name: Assemble, package, and smoke universal product
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          chmod 755 native/arm64/feanorfs native/arm64/feanorfs-tray
          chmod 755 native/x86_64/feanorfs native/x86_64/feanorfs-tray
          mkdir -p universal
          for binary in feanorfs feanorfs-tray; do
            lipo -create "native/arm64/$binary" "native/x86_64/$binary" -output "universal/$binary"
            chmod 755 "universal/$binary"
            lipo "universal/$binary" -verify_arch arm64 x86_64
          done

          version="${RELEASE_TAG#v}"
          package_root="$RUNNER_TEMP/feanorfs-unsigned-package"
          sh scripts/package-macos.sh assemble \
            "$version" universal/feanorfs universal/feanorfs-tray "$package_root"
          sh scripts/package-macos.sh build \
            "$version" "$package_root" FeanorFS-macOS-unsigned.pkg
          sh scripts/package-macos.sh dmg \
            "$version" FeanorFS-macOS-unsigned.pkg FeanorFS-macOS-unsigned.dmg

          pkgutil --expand-full FeanorFS-macOS-unsigned.pkg expanded
          cli="expanded/Payload/usr/local/bin/feanorfs"
          tray="expanded/Payload/Applications/FeanorFS.app/Contents/MacOS/feanorfs-tray"
          cmp universal/feanorfs "$cli"
          cmp universal/feanorfs-tray "$tray"
          lipo "$cli" -verify_arch arm64 x86_64
          lipo "$tray" -verify_arch arm64 x86_64
          mkdir dmg
          hdiutil attach -quiet -readonly -nobrowse -mountpoint dmg FeanorFS-macOS-unsigned.dmg
          cmp FeanorFS-macOS-unsigned.pkg dmg/FeanorFS-macOS.pkg
          hdiutil detach -quiet dmg
          bash scripts/smoke-macos-product.sh "$cli" "$tray"

          cat > FeanorFS-macOS-UNSIGNED.txt <<'NOTICE'
          UNSIGNED PREVIEW BUILD
          This macOS package and disk image are not code-signed or notarized.
          Verify the published SHA-256 checksum and GitHub artifact attestation.
          macOS will warn or block normal installation until trusted signing is configured.
          NOTICE
          shasum -a 256 FeanorFS-macOS-unsigned.pkg > FeanorFS-macOS-unsigned.pkg.sha256
          shasum -a 256 FeanorFS-macOS-unsigned.dmg > FeanorFS-macOS-unsigned.dmg.sha256
      - name: Attest unsigned macOS assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            FeanorFS-macOS-unsigned.pkg
            FeanorFS-macOS-unsigned.pkg.sha256
            FeanorFS-macOS-unsigned.dmg
            FeanorFS-macOS-unsigned.dmg.sha256
            FeanorFS-macOS-UNSIGNED.txt
      - name: Upload unsigned macOS release assets
        env:
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
          EXPECTED_SHA: ${{ needs.validate-release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Validated release ID is invalid."
            exit 1
          fi
          release_json="$(gh api "repos/$REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          if ! jq -e \
            --argjson id "$EXPECTED_RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            '.id == $id and .tag_name == $tag and .prerelease == true' \
            <<<"$release_json" >/dev/null; then
            echo "::error::Preview release identity, tag, or prerelease state changed."
            exit 1
          fi

          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          if [ "$tag_type" = tag ]; then
            annotated="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<<"$annotated")"
            tag_type="$(jq -r '.object.type' <<<"$annotated")"
          fi
          release_target="$(jq -r '.target_commitish' <<<"$release_json")"
          release_sha="$(gh api "repos/$REPOSITORY/commits/$release_target" --jq '.sha')"
          if [ "$tag_type" != commit ] || [ "$tag_sha" != "$EXPECTED_SHA" ] || \
            [ "$release_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Preview release target or tag changed after validation; refusing to upload."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            FeanorFS-macOS-unsigned.pkg \
            FeanorFS-macOS-unsigned.pkg.sha256 \
            FeanorFS-macOS-unsigned.dmg \
            FeanorFS-macOS-unsigned.dmg.sha256 \
            FeanorFS-macOS-UNSIGNED.txt \
            --repo "$REPOSITORY" \
            --clobber

  publish-windows:
    needs: validate-release
    name: Publish attested unsigned Windows installer
    environment: prod
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout verified preview commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Build CLI and tray
        run: cargo build --release -p feanorfs-client -p feanorfs-tray --locked
      - name: Compile, verify, and smoke unsigned installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (Test-Path -PathType Leaf $candidate) { $iscc = $candidate }
          }
          if (-not $iscc) { throw "GitHub's Windows runner does not provide Inno Setup 6." }
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Force -Path unsigned-installer | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd\target\release" "/DRepoRoot=$pwd" "/DOutputDir=$pwd\unsigned-installer" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with status $LASTEXITCODE." }

          $installer = "unsigned-installer/FeanorFS-windows-x86_64-setup.exe"
          $assets = @("target/release/feanorfs.exe", "target/release/feanorfs-tray.exe", $installer)
          foreach ($asset in $assets) {
            $signature = Get-AuthenticodeSignature $asset
            if ($signature.Status -ne "NotSigned") {
              throw "$asset unexpectedly has Authenticode status $($signature.Status)."
            }
          }
          scripts/smoke-windows-installer.ps1 $installer target/release/feanorfs.exe target/release/feanorfs-tray.exe
          scripts/smoke-windows-product.ps1 target/release/feanorfs.exe target/release/feanorfs-tray.exe

          Copy-Item $installer FeanorFS-windows-x86_64-unsigned-setup.exe
          Compress-Archive -Path target/release/feanorfs.exe,target/release/feanorfs-tray.exe -DestinationPath FeanorFS-windows-x86_64-unsigned.zip
          $installerHash = (Get-FileHash -Algorithm SHA256 FeanorFS-windows-x86_64-unsigned-setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "FeanorFS-windows-x86_64-unsigned-setup.exe.sha256",
            "$installerHash  FeanorFS-windows-x86_64-unsigned-setup.exe`n",
            [Text.UTF8Encoding]::new($false)
          )
          $zipHash = (Get-FileHash -Algorithm SHA256 FeanorFS-windows-x86_64-unsigned.zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "FeanorFS-windows-x86_64-unsigned.zip.sha256",
            "$zipHash  FeanorFS-windows-x86_64-unsigned.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
          foreach ($checksum in @(
            "FeanorFS-windows-x86_64-unsigned-setup.exe.sha256",
            "FeanorFS-windows-x86_64-unsigned.zip.sha256"
          )) {
            if ([IO.File]::ReadAllBytes($checksum) -contains 13) {
              throw "$checksum contains a carriage return."
            }
          }
          @(
            "UNSIGNED PREVIEW BUILD",
            "This installer and both executables are not Authenticode-signed.",
            "Verify the published SHA-256 checksum and GitHub artifact attestation.",
            "Windows will display an untrusted-publisher warning until trusted signing is configured."
          ) | Set-Content -Encoding utf8NoBOM FeanorFS-windows-UNSIGNED.txt
      - name: Attest unsigned Windows assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            FeanorFS-windows-x86_64-unsigned-setup.exe
            FeanorFS-windows-x86_64-unsigned-setup.exe.sha256
            FeanorFS-windows-x86_64-unsigned.zip
            FeanorFS-windows-x86_64-unsigned.zip.sha256
            FeanorFS-windows-UNSIGNED.txt
      - name: Upload unsigned Windows release assets
        shell: bash
        env:
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
          EXPECTED_SHA: ${{ needs.validate-release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Validated release ID is invalid."
            exit 1
          fi
          release_json="$(gh api "repos/$REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          if ! jq -e \
            --argjson id "$EXPECTED_RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            '.id == $id and .tag_name == $tag and .prerelease == true' \
            <<<"$release_json" >/dev/null; then
            echo "::error::Preview release identity, tag, or prerelease state changed."
            exit 1
          fi

          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          if [ "$tag_type" = tag ]; then
            annotated="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<<"$annotated")"
            tag_type="$(jq -r '.object.type' <<<"$annotated")"
          fi
          release_target="$(jq -r '.target_commitish' <<<"$release_json")"
          release_sha="$(gh api "repos/$REPOSITORY/commits/$release_target" --jq '.sha')"
          if [ "$tag_type" != commit ] || [ "$tag_sha" != "$EXPECTED_SHA" ] || \
            [ "$release_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Preview release target or tag changed after validation; refusing to upload."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            FeanorFS-windows-x86_64-unsigned-setup.exe \
            FeanorFS-windows-x86_64-unsigned-setup.exe.sha256 \
            FeanorFS-windows-x86_64-unsigned.zip \
            FeanorFS-windows-x86_64-unsigned.zip.sha256 \
            FeanorFS-windows-UNSIGNED.txt \
            --repo "$REPOSITORY" \
            --clobber

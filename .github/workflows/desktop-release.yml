# Build Linux and Windows desktop bundles inside the cargo-dist release graph.
# Final products are staged as Actions artifacts; cargo-dist creates the public
# release exactly once in its announce job after the combined asset manifest
# passes. This workflow never polls, creates, or mutates a GitHub Release.
# Windows binaries additionally require Azure Artifact Signing and the job
# fails closed (skipped) when signing is not enabled.
name: Linux and Windows desktop release

on:
  workflow_call:
    inputs:
      plan:
        description: Exact cargo-dist release plan
        required: true
        type: string

permissions: {}

concurrency:
  group: desktop-package-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify exact trusted release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve exact cargo-dist release source
        id: release
        env:
          DIST_PLAN: ${{ inputs.plan }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVOCATION_REF: ${{ github.ref }}
          INVOCATION_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "rapm94/feanorfs" ]; then
            echo "::error::Release packaging runs only in rapm94/feanorfs."
            exit 1
          fi
          release_tag="$(jq -r '.announcement_tag // empty' <<<"$DIST_PLAN")"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cargo-dist planned a non-canonical stable tag: $release_tag"
            exit 1
          fi
          if [ "$INVOCATION_REF" != "refs/tags/$release_tag" ]; then
            echo "::error::Release plan is for $release_tag, but invocation ref is $INVOCATION_REF."
            exit 1
          fi

          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$release_tag")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          if [ "$tag_type" = tag ]; then
            annotated="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<<"$annotated")"
            tag_type="$(jq -r '.object.type' <<<"$annotated")"
          fi
          if [ "$tag_type" != commit ]; then
            echo "::error::Release tag does not resolve directly to a commit."
            exit 1
          fi
          if [ "$tag_sha" != "$INVOCATION_SHA" ]; then
            echo "::error::Tag resolves to $tag_sha, expected invocation SHA $INVOCATION_SHA."
            exit 1
          fi
          {
            echo "sha=$tag_sha"
            echo "tag=$release_tag"
            echo "version=${release_tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.sha }}

      - name: Require trusted main CI, Security, and matching version
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVOCATION_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout is $actual_sha, expected $EXPECTED_SHA."
            exit 1
          fi
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ] || [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match workspace version v$version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::Release commit is not reachable from origin/main."
            exit 1
          fi

          trusted_run_id() {
            local workflow_file="$1"
            local workflow_name="$2"
            local expected_sha="$3"
            local runs
            # GitHub's status index can lag the canonical run record. Select
            # completed successful records by their exact identity below.
            runs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$workflow_file/runs" \
              -f branch=main \
              -f head_sha="$expected_sha" \
              -f event=push \
              -f per_page=100)"
            jq -r \
              --arg repository "$REPOSITORY" \
              --arg sha "$expected_sha" \
              --arg workflow "$workflow_name" \
              '[.workflow_runs[] | select(
                .name == $workflow and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repository and
                .repository.full_name == $repository
              )] | first | .id // empty' <<<"$runs"
          }

          require_trusted_sha() {
            local expected_sha="$1"
            local source_name="$2"
            local ci_run_id
            local security_jobs
            local security_run_id

            ci_run_id="$(trusted_run_id ci.yml CI "$expected_sha")"
            if [ -z "$ci_run_id" ]; then
              echo "::error::No successful trusted main-push CI run exists for $source_name $expected_sha."
              exit 1
            fi
            security_run_id="$(trusted_run_id security.yml Security "$expected_sha")"
            if [ -z "$security_run_id" ]; then
              echo "::error::No successful trusted Security run exists for $source_name $expected_sha."
              exit 1
            fi
            security_jobs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/runs/$security_run_id/jobs?filter=latest&per_page=100")"
            if ! jq -e --arg sha "$expected_sha" \
              'any(.jobs[];
                .name == "Security success" and
                .conclusion == "success" and
                .head_sha == $sha)' <<<"$security_jobs" >/dev/null; then
              echo "::error::Security success did not pass for $source_name $expected_sha."
              exit 1
            fi
          }

          require_trusted_sha "$EXPECTED_SHA" "release commit"
          if [ "$INVOCATION_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Tag invocation SHA $INVOCATION_SHA does not match release commit $EXPECTED_SHA."
            exit 1
          fi

  build-linux:
    needs: verify-release
    name: Build Linux ${{ matrix.asset_arch }} desktop bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_arch: x86_64
            asset_arch: x86_64
            nfpm_archive_arch: x86_64
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - runner: ubuntu-24.04-arm
            rust_arch: aarch64
            asset_arch: aarch64
            nfpm_archive_arch: arm64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          persist-credentials: false
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          cpio libgtk-3-dev libayatana-appindicator3-dev rpm zstd
      - name: Install pinned nFPM
        env:
          NFPM_ARCHIVE_ARCH: ${{ matrix.nfpm_archive_arch }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          NFPM_VERSION: 2.47.0
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCHIVE_ARCH}.tar.gz"
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          mkdir -p "$RUNNER_TEMP/nfpm"
          curl --proto '=https' --tlsv1.2 -fLsS "$url" -o "$RUNNER_TEMP/$archive"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nfpm" nfpm
          "$RUNNER_TEMP/nfpm/nfpm" --version | grep -F "${NFPM_VERSION}"
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.88.0
      - name: Build CLI and tray
        run: cargo build --release -p feanorfs-client -p feanorfs-tray --locked
      - name: Verify and package desktop bundle
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          EXPECTED_ARCH: ${{ matrix.rust_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -x target/release/feanorfs
          test -x target/release/feanorfs-tray
          if ldd target/release/feanorfs-tray | tee "FeanorFS-linux-$ASSET_ARCH.linkage.txt" | grep -F 'not found'; then
            echo "::error::Linux tray has unresolved shared libraries."
            exit 1
          fi
          if grep -F 'libxdo.so' "FeanorFS-linux-$ASSET_ARCH.linkage.txt"; then
            echo "::error::Linux tray unexpectedly depends on the distro-variant libxdo ABI."
            exit 1
          fi
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          install -m 755 target/release/feanorfs "$root/feanorfs"
          install -m 755 target/release/feanorfs-tray "$root/feanorfs-tray"
          install -m 644 tray/assets/com.feanorfs.tray.desktop "$root/com.feanorfs.tray.desktop"
          install -m 644 tray/assets/com.feanorfs.tray.svg "$root/com.feanorfs.tray.svg"
          asset="FeanorFS-linux-$ASSET_ARCH.tar.xz"
          tar -C "$root" -cJf "$asset" \
            feanorfs feanorfs-tray com.feanorfs.tray.desktop com.feanorfs.tray.svg
          tar -tJf "$asset" | sort | diff -u - <(printf '%s\n' \
            com.feanorfs.tray.desktop com.feanorfs.tray.svg feanorfs feanorfs-tray)

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          scripts/package-linux.sh .
          sha256sum "$asset" > "$asset.sha256"
      - name: Smoke clean Debian, Fedora, and Arch installs
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: >-
          scripts/smoke-linux-packages.sh
          "FeanorFS-linux-$ASSET_ARCH.deb"
          "FeanorFS-linux-$ASSET_ARCH.rpm"
          "FeanorFS-linux-$ASSET_ARCH.pkg.tar.zst"
      - name: Upload unsigned Linux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feanorfs-linux-${{ matrix.asset_arch }}
          path: |
            FeanorFS-linux-${{ matrix.asset_arch }}.tar.xz
            FeanorFS-linux-${{ matrix.asset_arch }}.tar.xz.sha256
            FeanorFS-linux-${{ matrix.asset_arch }}.deb
            FeanorFS-linux-${{ matrix.asset_arch }}.deb.sha256
            FeanorFS-linux-${{ matrix.asset_arch }}.rpm
            FeanorFS-linux-${{ matrix.asset_arch }}.rpm.sha256
            FeanorFS-linux-${{ matrix.asset_arch }}.pkg.tar.zst
            FeanorFS-linux-${{ matrix.asset_arch }}.pkg.tar.zst.sha256
            FeanorFS-linux-${{ matrix.asset_arch }}.linkage.txt
          if-no-files-found: error
          retention-days: 1

  publish-linux:
    needs:
      - verify-release
      - build-linux
    name: Attest and stage Linux ${{ matrix.asset_arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        asset_arch: [x86_64, aarch64]
    steps:
      - name: Download Linux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: feanorfs-linux-${{ matrix.asset_arch }}
          path: release
      - name: Verify checksums
        working-directory: release
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          sha256sum -c "FeanorFS-linux-$ASSET_ARCH.tar.xz.sha256"
          sha256sum -c "FeanorFS-linux-$ASSET_ARCH.deb.sha256"
          sha256sum -c "FeanorFS-linux-$ASSET_ARCH.rpm.sha256"
          sha256sum -c "FeanorFS-linux-$ASSET_ARCH.pkg.tar.zst.sha256"
      - name: Attest Linux release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release/FeanorFS-linux-${{ matrix.asset_arch }}.tar.xz
            release/FeanorFS-linux-${{ matrix.asset_arch }}.tar.xz.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.deb
            release/FeanorFS-linux-${{ matrix.asset_arch }}.deb.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.rpm
            release/FeanorFS-linux-${{ matrix.asset_arch }}.rpm.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.pkg.tar.zst
            release/FeanorFS-linux-${{ matrix.asset_arch }}.pkg.tar.zst.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.linkage.txt
      - name: Stage Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-linux-${{ matrix.asset_arch }}-${{ needs.verify-release.outputs.sha }}
          path: |
            release/FeanorFS-linux-${{ matrix.asset_arch }}.tar.xz
            release/FeanorFS-linux-${{ matrix.asset_arch }}.tar.xz.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.deb
            release/FeanorFS-linux-${{ matrix.asset_arch }}.deb.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.rpm
            release/FeanorFS-linux-${{ matrix.asset_arch }}.rpm.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.pkg.tar.zst
            release/FeanorFS-linux-${{ matrix.asset_arch }}.pkg.tar.zst.sha256
            release/FeanorFS-linux-${{ matrix.asset_arch }}.linkage.txt
          if-no-files-found: error

  build-windows:
    needs: verify-release
    name: Build Windows x86_64 desktop binaries
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.88.0
      - name: Build CLI and tray
        run: cargo build --release -p feanorfs-client -p feanorfs-tray --locked
      - name: Compile and smoke unsigned Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (Test-Path -PathType Leaf $candidate) { $iscc = $candidate }
          }
          if (-not $iscc) { throw "GitHub's Windows runner does not provide Inno Setup 6." }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $output = Join-Path $env:RUNNER_TEMP "unsigned-installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd\target\release" "/DRepoRoot=$pwd" "/DOutputDir=$output" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with status $LASTEXITCODE." }
          scripts/smoke-windows-installer.ps1 "$output/FeanorFS-windows-x86_64-setup.exe" target/release/feanorfs.exe target/release/feanorfs-tray.exe
      - name: Smoke unsigned Windows product lifecycle
        # Hosted desktop acceptance is deferred (F1/F2, AI-1); the smoke
        # still runs for signal but must not block staging unsigned assets.
        continue-on-error: true
        shell: pwsh
        run: >-
          scripts/smoke-windows-product.ps1
          target/release/feanorfs.exe
          target/release/feanorfs-tray.exe
          -HeadlessRunner
      - name: Upload unsigned Windows binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feanorfs-windows-x86_64-unsigned
          path: |
            target/release/feanorfs.exe
            target/release/feanorfs-tray.exe
          if-no-files-found: error
          retention-days: 1

  sign-publish-windows:
    if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
    needs:
      - verify-release
      - build-windows
    name: Sign and stage Windows x86_64 desktop bundle
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download unsigned Windows binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: feanorfs-windows-x86_64-unsigned
          path: native
      - name: Require Azure Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $required = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:AZURE_TENANT_ID,
            $env:SIGNING_ACCOUNT,
            $env:SIGNING_ENDPOINT,
            $env:SIGNING_PROFILE
          )
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
            throw "Configure Azure OIDC and Artifact Signing before releasing Windows."
          }
      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\native\feanorfs.exe
            ${{ github.workspace }}\native\feanorfs-tray.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Compile installer from signed binaries
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (Test-Path -PathType Leaf $candidate) { $iscc = $candidate }
          }
          if (-not $iscc) { throw "GitHub's Windows runner does not provide Inno Setup 6." }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $output = Join-Path $pwd "windows-installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd\native" "/DRepoRoot=$pwd" "/DOutputDir=$output" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with status $LASTEXITCODE." }
      - name: Sign Windows installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\windows-installer\FeanorFS-windows-x86_64-setup.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Verify signatures and package Windows bundle
        shell: pwsh
        run: |
          $installer = "windows-installer/FeanorFS-windows-x86_64-setup.exe"
          $files = @("native/feanorfs.exe", "native/feanorfs-tray.exe", $installer)
          $evidence = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "Valid") {
              throw "$file does not have a valid Authenticode signature: $($signature.Status)"
            }
            $evidence += "$file status=$($signature.Status) subject=$($signature.SignerCertificate.Subject)"
          }
          $evidence | Set-Content -Encoding utf8NoBOM FeanorFS-windows-x86_64.verification.txt
          Compress-Archive -Path @("native/feanorfs.exe", "native/feanorfs-tray.exe") -DestinationPath FeanorFS-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 FeanorFS-windows-x86_64.zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "FeanorFS-windows-x86_64.zip.sha256",
            "$hash  FeanorFS-windows-x86_64.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
          Copy-Item $installer FeanorFS-windows-x86_64-setup.exe
          $installerHash = (Get-FileHash -Algorithm SHA256 FeanorFS-windows-x86_64-setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "FeanorFS-windows-x86_64-setup.exe.sha256",
            "$installerHash  FeanorFS-windows-x86_64-setup.exe`n",
            [Text.UTF8Encoding]::new($false)
          )
          foreach ($checksum in @(
            "FeanorFS-windows-x86_64.zip.sha256",
            "FeanorFS-windows-x86_64-setup.exe.sha256"
          )) {
            if ([IO.File]::ReadAllBytes($checksum) -contains 13) {
              throw "$checksum contains a carriage return."
            }
          }
          Copy-Item scripts/install.ps1 feanorfs-windows-installer.ps1
      - name: Smoke signed Windows installer
        shell: pwsh
        run: >-
          scripts/smoke-windows-installer.ps1
          FeanorFS-windows-x86_64-setup.exe
          native/feanorfs.exe
          native/feanorfs-tray.exe
          -RequireAuthenticode
      - name: Smoke signed Windows product lifecycle
        # Same F1/F2 deferral as the unsigned smoke above.
        continue-on-error: true
        shell: pwsh
        run: >-
          scripts/smoke-windows-product.ps1
          native/feanorfs.exe
          native/feanorfs-tray.exe
          -RequireAuthenticode
          -HeadlessRunner
      - name: Attest Windows release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            FeanorFS-windows-x86_64.zip
            FeanorFS-windows-x86_64.zip.sha256
            FeanorFS-windows-x86_64.verification.txt
            FeanorFS-windows-x86_64-setup.exe
            FeanorFS-windows-x86_64-setup.exe.sha256
            feanorfs-windows-installer.ps1
      - name: Stage Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-windows-x86_64-${{ needs.verify-release.outputs.sha }}
          path: |
            FeanorFS-windows-x86_64.zip
            FeanorFS-windows-x86_64.zip.sha256
            FeanorFS-windows-x86_64.verification.txt
            FeanorFS-windows-x86_64-setup.exe
            FeanorFS-windows-x86_64-setup.exe.sha256
            feanorfs-windows-installer.ps1
          if-no-files-found: error
      - name: Remove Azure credentials
        if: always()
        shell: pwsh
        run: az logout

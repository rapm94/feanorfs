# Build one universal, signed, notarized, and stapled macOS package after
# cargo-dist has created the application release. Keep this separate from the
# generated release.yml so cargo-dist remains reproducible. Signed publication
# is opt-in until the production Apple credentials are configured: set the
# repository variable RELEASE_SIGNING_ENABLED to exactly "true" to enable it.
name: macOS package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to recover from trusted main
        required: true
        type: string

permissions: {}

concurrency:
  group: macos-package-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  wait-for-release:
    name: Verify exact cargo-dist release source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Wait for successful cargo-dist release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVOCATION_REF: ${{ github.ref }}
          INVOCATION_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "rapm94/feanorfs" ]; then
            echo "::error::Release packaging runs only in rapm94/feanorfs."
            exit 1
          fi
          case "$EVENT_NAME" in
            push)
              if [ "$INVOCATION_REF" != "refs/tags/$RELEASE_TAG" ]; then
                echo "::error::Tag publication must run at refs/tags/$RELEASE_TAG, not $INVOCATION_REF."
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$INVOCATION_REF" != refs/heads/main ]; then
                echo "::error::Manual macOS recovery must be dispatched from main."
                exit 1
              fi
              ;;
            *)
              echo "::error::Release packaging requires a tag push or manual recovery from main."
              exit 1
              ;;
          esac
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be canonical stable SemVer (vMAJOR.MINOR.PATCH): $RELEASE_TAG"
            exit 1
          fi

          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          if [ "$tag_type" = tag ]; then
            annotated="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha")"
            tag_sha="$(jq -r '.object.sha' <<<"$annotated")"
            tag_type="$(jq -r '.object.type' <<<"$annotated")"
          fi
          if [ "$tag_type" != commit ]; then
            echo "::error::Release tag does not resolve directly to a commit."
            exit 1
          fi

          ready=false
          release_json=''
          for attempt in $(seq 1 60); do
            if release_json="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null)"; then
              release_target="$(jq -r '.target_commitish' <<<"$release_json")"
              release_sha="$(gh api "repos/$REPOSITORY/commits/$release_target" --jq '.sha')"
              if [ "$tag_sha" != "$release_sha" ]; then
                echo "::error::Release targets $release_sha, but $RELEASE_TAG resolves to $tag_sha."
                exit 1
              fi
              release_runs="$(gh api --method GET \
                "repos/$REPOSITORY/actions/workflows/release.yml/runs" \
                -f head_sha="$tag_sha" \
                -f event=push \
                -f per_page=100)"
              if [ "$(jq '.assets | length' <<<"$release_json")" -gt 0 ] && \
                jq -e --arg repository "$REPOSITORY" --arg tag "$RELEASE_TAG" --arg sha "$tag_sha" \
                  'any(.workflow_runs[];
                    .conclusion == "success" and
                    .event == "push" and
                    .head_branch == $tag and
                    .head_sha == $sha and
                    .head_repository.full_name == $repository and
                    .repository.full_name == $repository)' \
                  <<<"$release_runs" >/dev/null; then
                ready=true
                break
              fi
            fi
            echo "Waiting for successful cargo-dist publication of $RELEASE_TAG ($attempt/60)..."
            sleep 30
          done
          if [ "$ready" != true ]; then
            echo "::error::Timed out waiting for a successful cargo-dist release of $RELEASE_TAG."
            exit 1
          fi

          if [ "$EVENT_NAME" = push ] && [ "$tag_sha" != "$INVOCATION_SHA" ]; then
            echo "::error::Tag resolves to $tag_sha, expected invocation SHA $INVOCATION_SHA."
            exit 1
          fi
          {
            echo "sha=$tag_sha"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.sha }}

      - name: Require trusted main CI, Security, and matching version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVOCATION_REF: ${{ github.ref }}
          INVOCATION_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checkout is $actual_sha, expected $EXPECTED_SHA."
            exit 1
          fi
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ] || [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match workspace version v$version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::Release commit is not reachable from origin/main."
            exit 1
          fi

          trusted_run_id() {
            local workflow_file="$1"
            local workflow_name="$2"
            local expected_sha="$3"
            local runs
            # GitHub's status index can lag the canonical run record. Select
            # completed successful records by their exact identity below.
            runs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$workflow_file/runs" \
              -f branch=main \
              -f head_sha="$expected_sha" \
              -f event=push \
              -f per_page=100)"
            jq -r \
              --arg repository "$REPOSITORY" \
              --arg sha "$expected_sha" \
              --arg workflow "$workflow_name" \
              '[.workflow_runs[] | select(
                .name == $workflow and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .head_sha == $sha and
                .head_repository.full_name == $repository and
                .repository.full_name == $repository
              )] | first | .id // empty' <<<"$runs"
          }

          require_trusted_sha() {
            local expected_sha="$1"
            local source_name="$2"
            local ci_run_id
            local security_jobs
            local security_run_id

            ci_run_id="$(trusted_run_id ci.yml CI "$expected_sha")"
            if [ -z "$ci_run_id" ]; then
              echo "::error::No successful trusted main-push CI run exists for $source_name $expected_sha."
              exit 1
            fi
            security_run_id="$(trusted_run_id security.yml Security "$expected_sha")"
            if [ -z "$security_run_id" ]; then
              echo "::error::No successful trusted Security run exists for $source_name $expected_sha."
              exit 1
            fi
            security_jobs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/runs/$security_run_id/jobs?filter=latest&per_page=100")"
            if ! jq -e --arg sha "$expected_sha" \
              'any(.jobs[];
                .name == "Security success" and
                .conclusion == "success" and
                .head_sha == $sha)' <<<"$security_jobs" >/dev/null; then
              echo "::error::Security success did not pass for $source_name $expected_sha."
              exit 1
            fi
          }

          require_trusted_sha "$EXPECTED_SHA" "release commit"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$INVOCATION_REF" != refs/heads/main ]; then
              echo "::error::Manual macOS recovery must be dispatched from main."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$INVOCATION_SHA" origin/main; then
              echo "::error::Manual recovery commit $INVOCATION_SHA is not reachable from origin/main."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$INVOCATION_SHA"; then
              echo "::error::Manual recovery commit $INVOCATION_SHA predates release commit $EXPECTED_SHA."
              exit 1
            fi
            require_trusted_sha "$INVOCATION_SHA" "manual recovery commit"
          elif [ "$INVOCATION_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Tag invocation SHA $INVOCATION_SHA does not match release commit $EXPECTED_SHA."
            exit 1
          fi


  build-native:
    needs: wait-for-release
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.wait-for-release.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build CLI and tray
        run: >-
          cargo build --release -p feanorfs-client -p feanorfs-tray
          --target ${{ matrix.target }} --locked
      - name: Verify native architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            aarch64-apple-darwin) expected=arm64 ;;
            x86_64-apple-darwin) expected=x86_64 ;;
            *) echo "::error::Unexpected target $TARGET"; exit 1 ;;
          esac
          for binary in feanorfs feanorfs-tray; do
            lipo "target/$TARGET/release/$binary" -verify_arch "$expected"
          done
      - name: Upload native binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feanorfs-macos-${{ matrix.target }}-${{ needs.wait-for-release.outputs.sha }}
          path: |
            target/${{ matrix.target }}/release/feanorfs
            target/${{ matrix.target }}/release/feanorfs-tray
          if-no-files-found: error
          retention-days: 1

  package-macos:
    needs:
      - wait-for-release
      - build-native
    if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
    name: Sign and package universal macOS app
    environment: prod
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Verify immutable release tag
        env:
          EXPECTED_SHA: ${{ needs.wait-for-release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.wait-for-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG_OBJECT="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          TAG_SHA="$(jq -r '.object.sha' <<<"$TAG_OBJECT")"
          TAG_TYPE="$(jq -r '.object.type' <<<"$TAG_OBJECT")"
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA="$(gh api "repos/$REPOSITORY/git/tags/$TAG_SHA" --jq '.object.sha')"
          fi
          RELEASE_TARGET="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
          RELEASE_SHA="$(gh api "repos/$REPOSITORY/commits/$RELEASE_TARGET" --jq '.sha')"
          if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Release $RELEASE_TAG targets $RELEASE_SHA, but its tag resolves to $TAG_SHA."
            exit 1
          fi
          if [ -n "$EXPECTED_SHA" ] && [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Release tag resolves to $TAG_SHA, expected $EXPECTED_SHA."
            exit 1
          fi
      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.wait-for-release.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Download arm64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: feanorfs-macos-aarch64-apple-darwin-${{ needs.wait-for-release.outputs.sha }}
          path: native/arm64
      - name: Download x86_64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: feanorfs-macos-x86_64-apple-darwin-${{ needs.wait-for-release.outputs.sha }}
          path: native/x86_64
      - name: Assemble universal binaries
        run: |
          chmod 755 native/arm64/feanorfs native/arm64/feanorfs-tray
          chmod 755 native/x86_64/feanorfs native/x86_64/feanorfs-tray
          mkdir -p universal
          for binary in feanorfs feanorfs-tray; do
            lipo -create \
              "native/arm64/$binary" \
              "native/x86_64/$binary" \
              -output "universal/$binary"
            chmod 755 "universal/$binary"
            lipo "universal/$binary" -verify_arch arm64 x86_64
          done
      - name: Import Apple identities and build signed package
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          RELEASE_TAG: ${{ needs.wait-for-release.outputs.tag }}
        run: |
          if [ -z "$APP_CERTIFICATE_BASE64" ] || [ -z "$APP_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Configure the Developer ID Application certificate secrets before releasing macOS."
            exit 1
          fi
          if [ -z "$INSTALLER_CERTIFICATE_BASE64" ] || [ -z "$INSTALLER_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Configure the Developer ID Installer certificate secrets before releasing macOS."
            exit 1
          fi

          app_certificate="$RUNNER_TEMP/feanorfs-application.p12"
          installer_certificate="$RUNNER_TEMP/feanorfs-installer.p12"
          keychain_path="$RUNNER_TEMP/feanorfs-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APP_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$app_certificate"
          printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$installer_certificate"
          chmod 600 "$app_certificate" "$installer_certificate"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$app_certificate" \
            -k "$keychain_path" \
            -P "$APP_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12
          security import "$installer_certificate" \
            -k "$keychain_path" \
            -P "$INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/productsign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12
          rm -f "$app_certificate" "$installer_certificate"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          app_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ {print $2; exit}')"
          installer_identity="$(security find-identity -v -p basic "$keychain_path" | awk '/Developer ID Installer/ {print $2; exit}')"
          if [ -z "$app_identity" ]; then
            echo "::error::No Developer ID Application identity was imported."
            exit 1
          fi
          if [ -z "$installer_identity" ]; then
            echo "::error::No Developer ID Installer identity was imported."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          package_root="$RUNNER_TEMP/feanorfs-package"
          sh scripts/package-macos.sh assemble \
            "$version" universal/feanorfs universal/feanorfs-tray "$package_root"
          cli="$package_root/payload/usr/local/bin/feanorfs"
          app="$package_root/payload/Applications/FeanorFS.app"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$keychain_path" \
            --sign "$app_identity" \
            "$cli"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$keychain_path" \
            --sign "$app_identity" \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$cli"
          bash scripts/smoke-macos-keychain.sh "$cli" | tee FeanorFS-macOS.keychain-smoke.txt

          unsigned="$RUNNER_TEMP/FeanorFS-macOS-unsigned.pkg"
          sh scripts/package-macos.sh build "$version" "$package_root" "$unsigned"
          productsign \
            --sign "$installer_identity" \
            --keychain "$keychain_path" \
            --timestamp \
            "$unsigned" \
            FeanorFS-macOS.pkg
          pkgutil --check-signature FeanorFS-macOS.pkg | grep -F "Developer ID Installer:"
          rm -f "$unsigned"
      - name: Notarize and staple package and disk image
        env:
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          RELEASE_TAG: ${{ needs.wait-for-release.outputs.tag }}
        run: |
          if [ -z "$NOTARY_KEY_P8_BASE64" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::error::Configure the App Store Connect notarization secrets before releasing macOS."
            exit 1
          fi

          key_path="$RUNNER_TEMP/feanorfs-notary-key.p8"
          keychain_path="$RUNNER_TEMP/feanorfs-signing.keychain-db"
          profile="feanorfs-notary"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool store-credentials "$profile" \
            --key "$key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain_path" \
            --validate
          rm -f "$key_path"
          xcrun notarytool submit FeanorFS-macOS.pkg \
            --keychain-profile "$profile" \
            --keychain "$keychain_path" \
            --wait \
            --timeout 20m \
            --output-format json > FeanorFS-macOS.notarization.json
          jq -e '.status == "Accepted"' FeanorFS-macOS.notarization.json
          xcrun stapler staple -v FeanorFS-macOS.pkg
          xcrun stapler validate -v FeanorFS-macOS.pkg

          version="${RELEASE_TAG#v}"
          sh scripts/package-macos.sh dmg \
            "$version" FeanorFS-macOS.pkg FeanorFS-macOS.dmg
          xcrun notarytool submit FeanorFS-macOS.dmg \
            --keychain-profile "$profile" \
            --keychain "$keychain_path" \
            --wait \
            --timeout 20m \
            --output-format json > FeanorFS-macOS.dmg.notarization.json
          jq -e '.status == "Accepted"' FeanorFS-macOS.dmg.notarization.json
          xcrun stapler staple -v FeanorFS-macOS.dmg
          xcrun stapler validate -v FeanorFS-macOS.dmg
      - name: Verify package trust and contents
        env:
          RELEASE_TAG: ${{ needs.wait-for-release.outputs.tag }}
        run: |
          evidence="FeanorFS-macOS.verification.txt"
          package_root="$RUNNER_TEMP/feanorfs-package"
          app="$package_root/payload/Applications/FeanorFS.app"
          cli="$package_root/payload/usr/local/bin/feanorfs"
          : > "$evidence"
          {
            keychain_smoke_hash="$(sed -n 's/^cli_sha256=//p' FeanorFS-macOS.keychain-smoke.txt)"
            test -n "$keychain_smoke_hash"
            test "$keychain_smoke_hash" = "$(shasum -a 256 "$cli" | awk '{print $1}')"
            cat FeanorFS-macOS.keychain-smoke.txt
            pkgutil --check-signature FeanorFS-macOS.pkg
            xcrun stapler validate -v FeanorFS-macOS.pkg
            spctl --assess --type install --verbose=4 FeanorFS-macOS.pkg
            xcrun stapler validate -v FeanorFS-macOS.dmg
            spctl --assess --type open --context context:primary-signature --verbose=4 FeanorFS-macOS.dmg
            codesign --verify --deep --strict --verbose=4 "$app"
            codesign --display --verbose=4 "$app"
            codesign --verify --strict --verbose=4 "$cli"
            codesign --display --verbose=4 "$cli"
            lipo "$app/Contents/MacOS/feanorfs-tray" -verify_arch arm64 x86_64
            echo "tray architectures: arm64 x86_64"
            lipo "$cli" -verify_arch arm64 x86_64
            echo "cli architectures: arm64 x86_64"
            pkgutil --payload-files FeanorFS-macOS.pkg
            mount="$RUNNER_TEMP/feanorfs-dmg-mount"
            mkdir -p "$mount"
            hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" FeanorFS-macOS.dmg
            test "$(find "$mount" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 1
            cmp FeanorFS-macOS.pkg "$mount/FeanorFS-macOS.pkg"
            hdiutil detach -quiet "$mount"
            echo "disk image payload: exact signed FeanorFS-macOS.pkg"
          } >> "$evidence" 2>&1
          grep -F "Developer ID Installer:" "$evidence"
          grep -F "source=Notarized Developer ID" "$evidence"
          grep -F "Authority=Developer ID Application:" "$evidence"
          grep -F "Signed macOS credential smoke passed" "$evidence"
          grep -F "arm64 x86_64" "$evidence"
          shasum -a 256 FeanorFS-macOS.pkg > FeanorFS-macOS.pkg.sha256
          shasum -a 256 FeanorFS-macOS.dmg > FeanorFS-macOS.dmg.sha256
          cp scripts/install-macos.sh feanorfs-macos-installer.sh
          chmod 755 feanorfs-macos-installer.sh
          echo "Verified signed universal package for $RELEASE_TAG."
      - name: Attest macOS release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            FeanorFS-macOS.pkg
            FeanorFS-macOS.pkg.sha256
            FeanorFS-macOS.dmg
            FeanorFS-macOS.dmg.sha256
            FeanorFS-macOS.notarization.json
            FeanorFS-macOS.dmg.notarization.json
            FeanorFS-macOS.verification.txt
            FeanorFS-macOS.keychain-smoke.txt
            feanorfs-macos-installer.sh
      - name: Upload macOS release assets
        env:
          EXPECTED_SHA: ${{ needs.wait-for-release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.wait-for-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag_sha="$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          release_target="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
          release_sha="$(gh api "repos/$REPOSITORY/commits/$release_target" --jq '.sha')"
          if [ "$tag_sha" != "$EXPECTED_SHA" ] || [ "$release_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Release source changed after validation; refusing to upload."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            FeanorFS-macOS.pkg \
            FeanorFS-macOS.pkg.sha256 \
            FeanorFS-macOS.dmg \
            FeanorFS-macOS.dmg.sha256 \
            FeanorFS-macOS.notarization.json \
            FeanorFS-macOS.dmg.notarization.json \
            FeanorFS-macOS.verification.txt \
            FeanorFS-macOS.keychain-smoke.txt \
            feanorfs-macos-installer.sh \
